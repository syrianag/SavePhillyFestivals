name: Deploy

# Production deployment is deliberate, never automatic. It requires an approved
# `production` GitHub environment, an explicit release SHA, and recorded backup
# evidence. See docs/DELIVERY-WORKFLOW.md.
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact commit SHA that passed all merge gates"
        required: true
      backup_reference:
        description: "Verified database backup identifier taken before this release"
        required: true

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Record release evidence
        run: |
          echo "Release SHA: ${{ inputs.release_sha }}"
          echo "Backup reference: ${{ inputs.backup_reference }}"

      - name: Apply database migrations
        run: pnpm exec prisma migrate deploy --config apps/save-philly-festivals/prisma.config.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build
        run: pnpm exec nx run save-philly-festivals:build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
